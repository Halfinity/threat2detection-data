name: Refresh site data

# Lives in the PUBLIC repository Halfinity/threat2detection-data (source of truth: deploy/data-repo/ in the private
# code repository). It checks out the private code with a read-only deploy key, runs the real intelligence pipeline
# against the live public sources and force-pushes the public site's JSON to this repository's `site-data` branch.
# threat2detection.netlify.app reads those files through a same-origin proxy (/data/*), so fresh data never needs a
# Netlify deploy. Running here keeps GitHub Actions free (public repositories have no minute limit).
#
# Trigger: GitHub's scheduler is best-effort (it fired only every 5-8 hours for this repository), so the primary
# trigger is a Netlify scheduled function (frontend/netlify/functions/refresh-data.mjs in the code repository) that
# calls workflow_dispatch every 5 minutes. The schedule below is a slower backup in case that trigger stops.
# Each run calls only the sources that are due (`t2d pipeline --due-only`, intervals in config/sources.yaml):
# KEV and feeds every 5 minutes with conditional requests, GitHub advisories every 10, NVD every 2 hours (NVD's
# guidance for automated clients), EPSS every 6 hours. Unchanged code skips the lab; unchanged data skips ranking.
#
# Safety: no pull_request triggers (fork pull requests can never reach the deploy key), the code checkout does not
# keep the key, and the job only writes to this repository with its own short-lived token.
on:
  schedule:
    - cron: "17 * * * *" # backup only: hourly (the 5-minute trigger comes from Netlify)
  workflow_dispatch:

permissions:
  contents: write # push the site-data branch of this repository

concurrency:
  group: refresh-site-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      T2D_LOG_JSON: "false"
      T2D_REPO_ROOT: ${{ github.workspace }}/code
      T2D_DATABASE_URL: sqlite:///${{ github.workspace }}/state/t2d.db
      # Optional: raises NVD rate limits if the repository owner adds this secret.
      T2D_NVD_API_KEY: ${{ secrets.T2D_NVD_API_KEY }}
      # The job's own token raises the GitHub advisories API limit (public data only).
      T2D_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the deploy key is configured
        env:
          HAS_KEY: ${{ secrets.T2D_CODE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Add the read-only deploy key of Halfinity/threat2detection as the secret T2D_CODE_DEPLOY_KEY."
            exit 1
          fi

      - name: Check out the (private) code
        uses: actions/checkout@v5
        with:
          repository: Halfinity/threat2detection
          ref: main
          ssh-key: ${{ secrets.T2D_CODE_DEPLOY_KEY }}
          persist-credentials: false
          path: code

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/pyproject.toml

      - run: pip install -e ./code/backend

      # The database persists between runs so change history, "new" badges and EPSS trends accumulate.
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: t2d-state-${{ github.run_id }}
          restore-keys: t2d-state-

      - name: Migrate
        run: mkdir -p state && t2d db upgrade

      - name: Collect what is due, test if code changed, rank if data changed
        run: t2d pipeline --due-only

      - name: Prune old bookkeeping (keeps intelligence and change history)
        run: t2d prune --days 14

      - name: Export site data
        run: t2d export-site --out site-data

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: t2d-state-${{ github.run_id }}

      - name: Publish to the site-data branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site-data
          git init -q -b site-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site data $(date -u +%Y-%m-%dT%H:%MZ)"
          # A single commit, force-pushed: the branch is a publishing channel, not history.
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-data

      - name: Summary
        run: |
          echo "### Site data published" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat site-data/meta.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
